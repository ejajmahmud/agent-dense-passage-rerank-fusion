[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dense-passage-rerank-fusion"
version = "0.1.0"
description = "Reciprocal Rank Fusion (RRF) combinator blending BM25, ColBERT token embeddings, and cross-encoder scores"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-dense-passage-rerank-fusion = "agent_dense_passage_rerank_fusion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_dense_passage_rerank_fusion*"]
